set_manual_temperature:
  name: Définir une consigne manuelle avec durée
  description: >-
    Applique une température manuelle sur un ou plusieurs radiateurs Intuis,
    pour une durée choisie (de 1h à 12h) — au lieu de la durée par défaut
    configurée dans l'appli Intuis Connect.
  target:
    entity:
      domain: climate
      integration: intuis
  fields:
    temperature:
      name: Température
      description: Consigne à appliquer, en °C.
      required: true
      example: 20.5
      selector:
        number:
          min: 7
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    duration_hours:
      name: Durée
      description: >-
        Durée pendant laquelle cette consigne reste active, avant retour
        automatique au mode programmé.
      required: true
      example: 3
      default: 3
      selector:
        number:
          min: 1
          max: 12
          step: 1
          unit_of_measurement: h
